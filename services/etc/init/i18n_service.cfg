{
    "jobs" : [
        {
            "name": "boot",
            "cmds": [
                "mkdir /data/service/el1/public/i18n/ 0755 i18n i18n",
                "mkdir /data/service/el1/public/i18n/timezone/ 0755 i18n i18n",
                "mkdir /data/service/el1/public/i18n/libphonenumber/ 0755 i18n i18n",
                "mkdir /data/service/el1/public/i18n/taboo/ 0755 i18n i18n",
                "mkdir /data/service/el1/public/i18n/global/ 0777 i18n i18n",
                "mkdir /data/service/el1/public/i18n/icu/ 0755 i18n i18n",
                "exec /system/bin/icu72_dat_mount"
            ]
        }
    ],
    "services" : [
        {
            "name": "i18n_service",
            "path": ["/system/bin/sa_main", "/system/profile/i18n_service.json"],
            "uid": "i18n",
            "gid": ["i18n", "shell"],
            "permission": [
                "ohos.permission.UPDATE_CONFIGURATION",
                "ohos.permission.MANAGE_SECURE_SETTINGS",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS"
            ],
            "ondemand": true,
            "importance": -20,
            "secon": "u:r:i18n_service:s0"
        }
    ]
}